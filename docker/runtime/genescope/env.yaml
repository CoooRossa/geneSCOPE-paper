name: tool
channels:
  - conda-forge
  - bioconda
dependencies:
  # base
  - r-base=4.4.*
  - git
  - bash
  - coreutils
  - time

  # compilers / build tools (R CMD INSTALL may compile small bits)
  - make
  - pkg-config
  - c-compiler
  - cxx-compiler

  # key R deps commonly needed for spatial tools + data
  - r-remotes
  - r-devtools
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-igraph
  - r-future.apply
  - r-foreach
  - r-rhpcblasctl
  - r-arrow
  - r-sf
  - r-spdep
  - r-ggrepel
  - r-scales

  # (optional but common) HDF5/Bioc deps
  - bioconductor-rhdf5
  - r-ggraph
  - r-ggforce
  - r-ggnewscale
  - r-rcppeigen
  - r-rcpparmadillo
  - r-sqldf
  - r-hash
  - r-plotrix
  - bioconductor-stringdb
